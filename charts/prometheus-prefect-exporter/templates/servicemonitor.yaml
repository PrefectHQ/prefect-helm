{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: "{{ .Release.Name }}"
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 8 }}
  endpoints:
  - port: http
    interval: {{ .Values.serviceMonitor.interval | quote }}
    scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout | quote }}
    {{- if .Values.serviceMonitor.metricRelabelings }}
    metricRelabelings:
    {{- toYaml .Values.serviceMonitor.metricRelabelings | nindent 4 }}
    {{- end }}
    # A stable instance label, and no pod label, keep the counters one series
    # across pod replacements, so increase() does not lose counts at a restart.
    # Scraping only ready endpoints keeps a terminating pod and its replacement
    # from writing into that one series; the two labels cover both discovery roles.
    relabelings:
    - action: keep
      sourceLabels:
      - __meta_kubernetes_endpointslice_endpoint_conditions_ready
      - __meta_kubernetes_endpoint_ready
      separator: ";"
      regex: ".*true.*"
    - targetLabel: instance
      replacement: {{ include "common.names.fullname" . }}
    - action: labeldrop
      regex: pod
    {{- with .Values.serviceMonitor.relabelings }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
