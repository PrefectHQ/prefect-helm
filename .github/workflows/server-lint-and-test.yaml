---
name: Lint and Test Prefect Server Chart

"on":
  pull_request:
    branches:
      - main

permissions:
  # required to read from the repo
  contents: read

jobs:
  lint_test:
    name: "lint-test (${{ matrix.kubernetes }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kubernetes:
          - "1.31.0"
          - "1.32.0"
          - "1.33.0"
          - "1.34.0"
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (lint)
        run: ct lint --config .github/linters/server-ct.yaml

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          node_image: "kindest/node:v${{ matrix.kubernetes }}"

      - name: Run chart-testing (install)
        run: ct install --config .github/linters/server-ct.yaml --helm-extra-set-args "--set=postgresql.auth.password=TESTING"
